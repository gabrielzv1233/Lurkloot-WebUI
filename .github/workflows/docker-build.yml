name: Build Docker image

on:
  workflow_dispatch:
    inputs:
      lurkloot_ref:
        description: Upstream jamezrin/lurkloot branch, tag, or commit SHA
        required: true
        default: develop
        type: string
      platforms:
        description: Docker platforms
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WebUI
        uses: actions/checkout@v5

      - name: Set up QEMU
        if: contains(inputs.platforms, ',')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          # The default .dockerbuild artifact is a Buildx diagnostic record,
          # not a runnable container image. Do not upload it as an Actions artifact.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          platforms: ${{ inputs.platforms }}
          build-args: |
            LURKLOOT_REF=${{ inputs.lurkloot_ref }}
          tags: |
            ghcr.io/gabrielzv1233/lurkloot-webui:latest
            ghcr.io/gabrielzv1233/lurkloot-webui:manual-${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.lurkloot.upstream-ref=${{ inputs.lurkloot_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export runnable amd64 image
        shell: bash
        run: |
          IMAGE="ghcr.io/gabrielzv1233/lurkloot-webui:manual-${{ github.run_number }}"
          docker pull --platform linux/amd64 "$IMAGE"
          docker save --output lurkloot-webui-linux-amd64.tar "$IMAGE"
          ls -lh lurkloot-webui-linux-amd64.tar

      - name: Upload runnable Docker image
        uses: actions/upload-artifact@v4
        with:
          name: lurkloot-webui-linux-amd64
          path: lurkloot-webui-linux-amd64.tar
          compression-level: 0
          if-no-files-found: error

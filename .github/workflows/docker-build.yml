name: Build Docker image

on:
  workflow_dispatch:
    inputs:
      lurkloot_ref:
        description: Upstream jamezrin/lurkloot branch, tag, or commit SHA
        required: true
        default: develop
        type: string
      platforms:
        description: Docker platforms
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WebUI
        uses: actions/checkout@v5

      - name: Set up QEMU
        if: contains(inputs.platforms, ',')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          platforms: ${{ inputs.platforms }}
          build-args: |
            LURKLOOT_REF=${{ inputs.lurkloot_ref }}
          tags: |
            ghcr.io/gabrielzv1233/lurkloot-webui:latest
            ghcr.io/gabrielzv1233/lurkloot-webui:manual-${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.lurkloot.upstream-ref=${{ inputs.lurkloot_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull amd64 image
        shell: bash
        run: |
          IMAGE="ghcr.io/gabrielzv1233/lurkloot-webui:manual-${{ github.run_number }}"
          docker pull --platform linux/amd64 "$IMAGE"

      - name: Smoke test runtime
        shell: bash
        run: |
          IMAGE="ghcr.io/gabrielzv1233/lurkloot-webui:manual-${{ github.run_number }}"
          docker run -d --name lurkloot-webui-smoke -p 18080:8080 "$IMAGE"

          cleanup() {
            docker logs lurkloot-webui-smoke || true
            docker rm -f lurkloot-webui-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then
              echo "WebUI runtime is healthy"
              curl --fail --silent http://127.0.0.1:18080/api/capabilities | grep -q '"browserTabs":false'
              curl --fail --silent http://127.0.0.1:18080/api/notifications/public-key | grep -q '"publicKey"'
              curl --fail --silent http://127.0.0.1:18080/sw.js | grep -q 'notificationclick'
              curl --fail --silent http://127.0.0.1:18080/manifest.webmanifest | grep -q 'Lurkloot WebUI'
              exit 0
            fi
            sleep 1
          done

          echo "WebUI runtime did not become healthy" >&2
          exit 1

      - name: Export runnable amd64 image
        shell: bash
        run: |
          IMAGE="ghcr.io/gabrielzv1233/lurkloot-webui:manual-${{ github.run_number }}"
          docker save --output lurkloot-webui-linux-amd64.tar "$IMAGE"
          ls -lh lurkloot-webui-linux-amd64.tar

      - name: Upload runnable Docker image
        uses: actions/upload-artifact@v4
        with:
          name: lurkloot-webui-linux-amd64
          path: lurkloot-webui-linux-amd64.tar
          compression-level: 0
          if-no-files-found: error
